[package]
name = "selldatatoai"
version = "1.0.0"
edition = "2021"
rust-version = "1.71"
authors = ["Alpha Quantum <info@alpha-quantum.com>"]
description = "Rust client for the Data Asset Score API from selldatatoai.com: score company domains 0 to 100 for the data AI buyers want, singly or in batches of 100"
license = "MIT"
homepage = "https://www.selldatatoai.com"
repository = "https://github.com/explainableaixai/selldatatoai-rust"
documentation = "https://www.selldatatoai.com/api/"
readme = "README.md"
keywords = ["ai-training-data", "data-broker", "company-data", "lead-scoring", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["target/*"]

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
